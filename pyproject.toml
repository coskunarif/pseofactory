[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pseofactory"
version = "0.1.0"
description = "Unified Multi-Tenant Autonomous pSEO and GEO Software Factory Substrate"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.5.0",
    "PyYAML>=6.0",
    "websockets>=12.0",
]

[project.scripts]
pseofactory = "pseofactory.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pseofactory*"]
[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-n auto --dist loadgroup"
markers = [
    "host_estate: tests requiring host workspace tenant repos, .agy scripts, local headless Chromium/Playwright, or host-only state",
]
