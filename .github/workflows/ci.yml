name: pSEO Factory CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-estate:
    name: Host Estate & Browser Tests (self-hosted)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run Host Estate Test Suite
        env:
          PSEUFACTORY_FAST_MODE: "1"
        run: |
          if [ -x "$HOME/projects/pseofactory/.venv/bin/pytest" ]; then
            "$HOME/projects/pseofactory/.venv/bin/pytest" pseofactory_tests/ -m host_estate -n 5 --dist loadgroup -q --durations=30
          else
            pytest pseofactory_tests/ -m host_estate -n 5 --dist loadgroup -q --durations=30
          fi

  portable-tests:
    name: Portable Suite Shard ${{ matrix.shard }}/4 (ubuntu-latest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install Engine and Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run Portable Test Shard ${{ matrix.shard }}/4
        env:
          PSEUFACTORY_FAST_MODE: "1"
        run: |
          pytest pseofactory_tests/ -m "not host_estate" --ci-shard=${{ matrix.shard }}/4 -n auto --dist loadgroup -q --durations=30

  post-deploy-indexnow:
    name: Post-Deploy IndexNow Ping (opt-in)
    runs-on: ubuntu-latest
    needs: [portable-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.INDEXNOW_POST_DEPLOY_ENABLED == '1'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
      - name: Push Changed Sitemap URLs to IndexNow
        env:
          INDEXNOW_POST_DEPLOY_ENABLED: ${{ vars.INDEXNOW_POST_DEPLOY_ENABLED }}
          INDEXNOW_DRY_RUN: ${{ vars.INDEXNOW_DRY_RUN || '0' }}
          INDEXNOW_DOMAIN: ${{ vars.INDEXNOW_DOMAIN || 'profithelm.com' }}
          INDEXNOW_DIST_DIR: ${{ vars.INDEXNOW_DIST_DIR || 'dist' }}
        run: |
          python3 -c "
          import json, os
          from pathlib import Path
          from pseofactory.indexer import push_changed_urls_to_indexnow_post_deploy
          dist = Path(os.environ.get('INDEXNOW_DIST_DIR', 'dist'))
          domain = os.environ.get('INDEXNOW_DOMAIN', 'profithelm.com')
          dry = os.environ.get('INDEXNOW_DRY_RUN', '0') == '1'
          if dist.is_dir() and (dist / 'sitemap.xml').is_file():
              res = push_changed_urls_to_indexnow_post_deploy(dist, domain, dry_run=dry)
              print(json.dumps(res, indent=2))
          else:
              print('No dist/sitemap.xml present; skipping post-deploy IndexNow.')
          "
