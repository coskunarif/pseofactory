name: pSEO Factory CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-estate:
    name: Host Estate & Browser Tests (self-hosted)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run Host Estate Test Suite
        env:
          PSEUFACTORY_FAST_MODE: "1"
        run: |
          if [ -x "$HOME/projects/pseofactory/.venv/bin/pytest" ]; then
            "$HOME/projects/pseofactory/.venv/bin/pytest" pseofactory_tests/ -m host_estate -n 5 --dist loadgroup -q --durations=30
          else
            pytest pseofactory_tests/ -m host_estate -n 5 --dist loadgroup -q --durations=30
          fi

  portable-tests:
    name: Portable Suite Shard ${{ matrix.shard }}/4 (ubuntu-latest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install Engine and Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run Portable Test Shard ${{ matrix.shard }}/4
        env:
          PSEUFACTORY_FAST_MODE: "1"
        run: |
          pytest pseofactory_tests/ -m "not host_estate" --ci-shard=${{ matrix.shard }}/4 -n auto --dist loadgroup -q --durations=30
