name: pSEO Factory CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run Central Engine Test Suite
        env:
          PSEUFACTORY_FAST_MODE: "1"
        run: |
          if [ -x "$HOME/projects/pseofactory/.venv/bin/pytest" ]; then
            "$HOME/projects/pseofactory/.venv/bin/pytest" pseofactory_tests/ -q
          else
            pytest pseofactory_tests/ -q
          fi
